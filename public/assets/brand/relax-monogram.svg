<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e8c775"/>
            <stop offset="50%" stop-color="#d4a550"/>
            <stop offset="100%" stop-color="#a37a2b"/>
        </linearGradient>
    </defs>
    <g stroke="url(#goldGrad)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        {{-- Crown peak --}}
        <path d="M100 18 L100 32 M90 28 Q100 20 110 28"/>
        <circle cx="100" cy="18" r="2.5" fill="url(#goldGrad)" stroke="none"/>

        {{-- Top flourishes (symmetric curls) --}}
        <path d="M60 50 Q55 40 62 34 Q72 30 80 38 Q85 44 82 52"/>
        <path d="M140 50 Q145 40 138 34 Q128 30 120 38 Q115 44 118 52"/>

        {{-- Top arch connecting curls --}}
        <path d="M62 46 Q100 28 138 46"/>

        {{-- Inner side swirls --}}
        <path d="M72 60 Q66 68 72 76 Q80 82 88 76"/>
        <path d="M128 60 Q134 68 128 76 Q120 82 112 76"/>

        {{-- Decorative leaf centerpiece --}}
        <path d="M100 42 Q96 52 100 62 Q104 52 100 42" fill="url(#goldGrad)" opacity=".7" stroke="none"/>

        {{-- Central 'R' monogram (stylized) --}}
        <path d="M72 78 L72 150" stroke-width="4"/>
        <path d="M72 78 L108 78 Q128 78 128 100 Q128 118 108 118 L72 118" stroke-width="4"/>
        <path d="M104 118 L132 150" stroke-width="4"/>

        {{-- Inner leaf in R bowl --}}
        <path d="M92 88 Q88 98 92 108 Q96 98 92 88" fill="url(#goldGrad)" opacity=".5" stroke="none"/>

        {{-- Bottom flourishes --}}
        <path d="M60 158 Q70 168 82 162 Q92 158 96 168" />
        <path d="M140 158 Q130 168 118 162 Q108 158 104 168" />

        {{-- Bottom leaf ornaments --}}
        <path d="M78 172 Q82 180 88 178 Q86 172 78 172" fill="url(#goldGrad)" opacity=".7" stroke="none"/>
        <path d="M122 172 Q118 180 112 178 Q114 172 122 172" fill="url(#goldGrad)" opacity=".7" stroke="none"/>
        <path d="M100 172 Q96 182 100 190 Q104 182 100 172" fill="url(#goldGrad)" opacity=".7" stroke="none"/>
    </g>
</svg>
